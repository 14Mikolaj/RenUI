name: Feature request
description: Propose a focused improvement to RenUI
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain the UI-library need and why existing behavior is insufficient.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired public API and behavior, if known.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds, extension targets, or other designs you considered.

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: Note effects on existing API, CMake consumers, resources, or supported platforms.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This request is reusable library functionality rather than application-specific policy.
          required: true
